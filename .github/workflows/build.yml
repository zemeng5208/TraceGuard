name: Build TraceGuard

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: dotnet test TraceGuard.sln --configuration Release
      - run: dotnet publish src/TraceGuard.Core/TraceGuard.Core.csproj --configuration Release --runtime win-x64 --self-contained true
      - name: Smoke-test zero-privilege core IPC
        shell: pwsh
        run: ./scripts/smoke-core.ps1 -Executable ./src/TraceGuard.Core/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/TraceGuard.Core.exe
      - run: npm run build
      - run: npm run package:win
      - name: Smoke-test packaged desktop
        shell: pwsh
        run: ./scripts/smoke-desktop.ps1 -Screenshot ./release/TraceGuard-Dashboard-${{ github.sha }}.png
      - name: Smoke-test portable package
        shell: pwsh
        run: ./scripts/smoke-portable.ps1
      - name: Smoke-test per-user install and uninstall
        shell: pwsh
        run: ./scripts/smoke-installer.ps1
      - name: Verify Windows package contents
        shell: pwsh
        run: ./scripts/verify-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TraceGuard-windows-x64
          path: |
            release/TraceGuard-*.exe
            release/TraceGuard-Dashboard-*.png
            release/SHA256SUMS.txt
          if-no-files-found: error
